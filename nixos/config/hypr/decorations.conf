general {
    gaps_in = 2
    gaps_out = 4

    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 0deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    #allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 6


    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # shadow {
    #     enabled = true
    #     range = 0
    #     render_power = 3
    #     color = rgba(1a1a1aee)
    # }
    shadow {
        enabled = false
        range = 15
        render_power = 2
        color = 0xff000000
    }
    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 2
        passes = 0
        passes = 1

        vibrancy = 0.0696
    }
}

plugin:hyprglass {
    enabled = 1

    blur_strength = 2.0
    blur_iterations = 2

    refraction_strength = 3.2
    chromatic_aberration = 0.15
    lens_distortion = 1.2

    edge_thickness = 0.025
    fresnel_strength = 1.4
    specular_strength = 1.3

    glass_opacity = 0.9
    tint_color = 0x20FFFFFF

    brightness = 1.05
    contrast = 1.05
    saturation = 1.0
    vibrancy = 0.1
}
