general {
    lock_cmd = pidof hyprlock || hyprlock   # Không chạy 2 lần nếu đang lock
    before_sleep_cmd = loginctl lock-session # Lock trước khi ngủ
    after_sleep_cmd = hyprctl dispatch dpms on # Bật màn hình sau khi thức
    ignore_dbus_inhibit = false
}

# Dim màn hình sau 4 phút
listener {
    timeout = 900
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Khoá màn hình sau 5 phút
listener {
    timeout = 1000
    on-timeout = loginctl lock-session
    on-resume = hyprctl dispatch dpms on
}

# Tắt màn hình sau 6 phút
listener {
    timeout = 1100
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend sau 10 phút
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
