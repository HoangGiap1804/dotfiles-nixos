# ╭──────────────────────────────────────────────────╮
# │              HYPRLOCK — nqim OS                  │
# │        Clean · Centered · Premium                │
# ╰──────────────────────────────────────────────────╯

# ──────────────────────────────
#  GENERAL
# ──────────────────────────────
general {
    no_fade_in        = false
    no_fade_out       = false
    fade_in_duration  = 500
    fade_out_duration = 300
    hide_cursor       = true
    grace             = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

# ──────────────────────────────
#  BACKGROUND — blurred wallpaper
# ──────────────────────────────
background {
    monitor      =
    path         = ~/.dotfiles/wallpapers/wallpaper2.jpg
    blur_size    = 6
    blur_passes  = 4
    noise        = 0.0117
    contrast     = 0.85
    brightness   = 0.75
    vibrancy     = 0.2
}

# ──────────────────────────────
#  GREETING — top left
# ──────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(if [ $(date +%H) -lt 12 ]; then echo '󰖨  Good morning'; elif [ $(date +%H) -lt 18 ]; then echo '  Good afternoon'; else echo '󰖔  Good evening'; fi), nqim"
    color       = rgba(255, 255, 255, 0.55)
    font_size   = 16
    font_family = Inter Variable, Regular
    position    = 48, -48
    halign      = left
    valign      = top
}

# ──────────────────────────────
#  TIME — large centered clock
# ──────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +'%H:%M')"
    color       = rgba(255, 255, 255, 0.96)
    font_size   = 160
    font_family = Inter Variable, Bold
    position    = 0, 80
    halign      = center
    valign      = center
}

# ──────────────────────────────
#  DATE — below clock
# ──────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color       = rgba(255, 255, 255, 0.60)
    font_size   = 20
    font_family = Inter Variable, Regular
    position    = 0, -15
    halign      = center
    valign      = center
}

# ──────────────────────────────
#  PASSWORD INPUT
# ──────────────────────────────
input-field {
    monitor              =
    size                 = 320, 52
    outline_thickness    = 2
    dots_size            = 0.28
    dots_spacing         = 0.20
    dots_center          = true
    dots_rounding        = -1

    outer_color          = rgba(255, 255, 255, 0.18)
    inner_color          = rgba(15, 15, 25, 0.55)
    font_color           = rgba(255, 255, 255, 0.90)

    fade_on_empty        = true
    fade_timeout         = 1000
    placeholder_text     = <span foreground="##ffffff66" font_size="14pt">󰌾  Enter password…</span>

    rounding             = 26

    check_color          = rgba(130, 220, 160, 0.90)
    fail_color           = rgba(230, 100, 100, 0.90)
    fail_text            = <span foreground="##ff6464" font_size="12pt">$FAIL ($ATTEMPTS)</span>
    fail_transition      = 300

    capslock_color       = rgba(255, 200, 80, 0.90)
    numlock_color        = -1
    bothlock_color       = -1

    hide_input           = false
    position             = 0, -130
    halign               = center
    valign               = center
}

# ──────────────────────────────
#  HINT — bottom center
# ──────────────────────────────
label {
    monitor     =
    text        =  Press Enter to unlock
    color       = rgba(255, 255, 255, 0.30)
    font_size   = 12
    font_family = Inter Variable, Regular
    position    = 0, 32
    halign      = center
    valign      = bottom
}
