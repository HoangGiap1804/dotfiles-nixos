set -g prefix C-s

set -g mouse on

set -g base-index 1
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g status-position bottom
set -g escape-time 0

# QUAN TRỌNG: fix fish trên NixOS
set -g default-shell /run/current-system/sw/bin/fish
set -g default-command /run/current-system/sw/bin/fish

# Fix màu cho Kitty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"

# UI
set -g status-style "bg=default,fg=#eeeeee"
set -g status-interval 1
set -g status-left-length 200
set -g status-left ""
set -g status-right ""
set -g status-justify "absolute-centre"

set -g window-status-current-format "#[bg=default fg=#ffffff]#[bg=#ffffff,fg=#000000] #I #W #F #[bg=default,fg=#ffffff]"
set -g window-status-format "#[bg=default fg=#121212]#[bg=#121212,fg=white] #I #W #F #[bg=default,fg=#121212]"

set -g pane-active-border-style "fg=white"
set -g pane-border-style "fg=white"
set -g message-style "bg=default,fg=white"
set -g mode-style "bg=#b5befe,fg=#11111b"
